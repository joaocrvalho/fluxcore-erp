<section class="panel panel--flush">
  <header class="panel__header--row">
    <div>
      <h2 class="panel__titulo">Despesas fixas recorrentes</h2>
      <p class="panel__sub">Compromissos que ocorrem todo mês</p>
    </div>
    <span class="badge tone-muted">{{ totalTexto() }}</span>
  </header>

  <ul class="linhas">
    @for (d of despesas(); track d.id) {
      <li class="item">
        <i class="marca" aria-hidden="true"></i>
        <span class="nome">{{ d.descricao }}</span>
        <span class="dia">dia {{ d.dia }}</span>
        <strong class="valor">{{ moeda(d.valor) }}</strong>
      </li>
    }
  </ul>

  <button type="button" class="gerenciar" (click)="gerenciar.emit()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3" />
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" />
    </svg>
    Gerenciar despesas fixas
  </button>
</section>
