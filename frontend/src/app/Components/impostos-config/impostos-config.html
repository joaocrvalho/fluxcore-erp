<section class="panel panel--flush">
  <header class="panel__header--row">
    <div>
      <h2 class="panel__titulo">Impostos configurados</h2>
      <p class="panel__sub">Aplicados automaticamente sobre as vendas</p>
    </div>
    <span class="badge tone-warning">{{ moedaMil(total()) }} neste mês</span>
  </header>

  <ul class="linhas">
    @for (i of impostos(); track i.id) {
      <li class="item">
        <span class="icone" aria-hidden="true">$</span>
        <div class="texto">
          <strong>{{ i.nome }}</strong>
          <span>{{ i.base }}</span>
        </div>
        <strong class="aliquota">{{ percentual(i.aliquota) }}</strong>
        <i
          class="status"
          role="img"
          [class.inativo]="!i.ativo"
          [attr.aria-label]="i.ativo ? 'Ativo' : 'Inativo'"
        ></i>
      </li>
    }
  </ul>

  <button type="button" class="gerenciar" (click)="gerenciar.emit()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3" />
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" />
    </svg>
    Gerenciar impostos
  </button>
</section>
